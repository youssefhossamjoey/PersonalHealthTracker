spring.application.name=PersonalHealthTracker

# Disable Docker Compose / Testcontainers integrations
spring.docker.compose.enabled=false
spring.testcontainers.enabled=false

# ==========================================
# Database Configuration
# ==========================================
# Defaults to local Docker setup, but reads AWS environment variables in production
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:paas}
spring.datasource.password=${DB_PASSWORD:changeme123}

# JPA / Hibernate Config
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Note: For production, change to 'validate' or 'none' after initial setup
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${FORMAT_SQL:false}

logging.level.org.hibernate.SQL=${LOG_SQL_LEVEL:INFO}
logging.level.org.hibernate.orm.tool.schema=${LOG_SCHEMA_LEVEL:INFO}

# ==========================================
# Security & JWT Configuration
# ==========================================
# In production, JWT_SECRET MUST be supplied via environment variable
jwt.secret=${JWT_SECRET:qaW3wXV51viBA1KEciX+1MpmXucXy+7aBReCloh1a6Q=}
jwt.expiry-ms=${JWT_EXPIRY_MS:900000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:3600000}

# Cookie Settings
app.refresh-token-cookie-samesite=${COOKIE_SAMESITE:Lax}
app.refresh-token-cookie-secure=${COOKIE_SECURE:false}